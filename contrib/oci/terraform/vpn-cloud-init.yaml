#cloud-config
# WireGuard server for the shpyrd VCN (contrib/oci/terraform/vpn.tf):
# one interface, one peer, NAT to the VCN through firewalld.
#
# Sized for the Always Free micro shape (1 GB): a swap file first, no full
# package update (dnf on OL9 needs more than 1 GB for that), weak
# dependencies off.
bootcmd:
  - [sh, -c, "test -f /swapfile || (fallocate -l 1G /swapfile && chmod 600 /swapfile && mkswap /swapfile)"]
  - [sh, -c, "swapon /swapfile 2>/dev/null || true"]
  - [sh, -c, "grep -q /swapfile /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab"]
write_files:
  - path: /etc/wireguard/wg0.conf
    permissions: "0600"
    content: |
      [Interface]
      Address = ${server_address}
      ListenPort = 51820
      PrivateKey = ${server_private}

      [Peer]
      PublicKey = ${client_public}
      AllowedIPs = ${client_address}/32
  - path: /etc/sysctl.d/99-wireguard.conf
    content: |
      net.ipv4.ip_forward = 1
runcmd:
  - sysctl --system
  - dnf -y --setopt=install_weak_deps=False install wireguard-tools
  - firewall-cmd --permanent --zone=public --add-port=51820/udp
  - firewall-cmd --permanent --zone=public --add-masquerade
  - firewall-cmd --permanent --zone=public --add-forward
  - firewall-cmd --reload
  - systemctl enable --now wg-quick@wg0
