# Equivalent of what `shpyrd cluster create` generates, for people who prefer
# to run kind by hand:
#
#   kind create cluster --config kind.yml
#   shpyrd cluster init --context kind-shpyrd
#
# - ports 80/443 on the host go to ingress-nginx on the control-plane
# - port 30050 exposes the in-cluster registry (docker push localhost:30050/...)
# - the service subnet is pinned so the registry can sit on 10.96.0.50
#
# After creation, `shpyrd cluster init` still needs the containerd registry
# mirror on each node; run:
#   for n in $(kind get nodes --name shpyrd); do
#     docker exec $n sh -c 'mkdir -p /etc/containerd/certs.d/10.96.0.50:5000 && printf "server = \"http://10.96.0.50:5000\"\n\n[host.\"http://10.96.0.50:5000\"]\n  capabilities = [\"pull\", \"resolve\", \"push\"]\n  skip_verify = true\n" > /etc/containerd/certs.d/10.96.0.50:5000/hosts.toml'
#   done
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: shpyrd
networking:
  serviceSubnet: 10.96.0.0/16
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      - containerPort: 30050
        hostPort: 30050
        protocol: TCP
  - role: worker
