# Release (RFC-0045): on a tag vX.Y.Z, build the server image for amd64 and
# arm64 and push it to GHCR, then let GoReleaser publish the CLI archives,
# checksums, release notes and the Homebrew formula.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    name: Server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/shpyrd-io/shpyrd-server:${{ github.ref_name }}
            ghcr.io/shpyrd-io/shpyrd-server:latest
          labels: |
            org.opencontainers.image.source=https://github.com/shpyrd-io/shpyrd
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MPL-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cli:
    name: CLI, checksums, Homebrew
    runs-on: ubuntu-latest
    needs: [image] # the release notes name an image that must exist
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changelog needs the previous tag
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
