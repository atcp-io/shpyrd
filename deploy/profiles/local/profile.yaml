name: local
description: Local kind cluster with host ports, magic DNS and a development CA
vars:
  SHPYRD_DOMAIN: 127.0.0.1.nip.io
  SHPYRD_REGISTRY_IP: 10.96.0.50
  SHPYRD_REGISTRY_HOST: 10.96.0.50:5000
  SHPYRD_SERVER_IMAGE: ghcr.io/shpyrd-io/shpyrd-server:latest
  SHPYRD_HTTP_PORT: "80"
  SHPYRD_HTTPS_PORT: "443"
  # kind's default pod network; project network policies exclude it from
  # the "internet" egress rule so projects cannot reach each other.
  SHPYRD_POD_CIDR: 10.244.0.0/16
runlevels:
  # CRD-only components first: later charts create ServiceMonitors.
  - name: rc0
    components: [monitoring-crds]
  - name: rc1
    components: [cert-manager]
  - name: rc2
    components: [ca-issuers, trust-manager, ingress-nginx, registry]
  - name: rc3
    components: [kpack, monitoring]
  - name: rc4
    components: [shpyrd]
