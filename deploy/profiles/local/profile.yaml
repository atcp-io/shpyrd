name: local
description: Local kind cluster with host ports, magic DNS and a development CA
vars:
  SHPYRD_DOMAIN: 127.0.0.1.nip.io
  # In-cluster registry (RFC-0059): a fixed ClusterIP, TLS from the platform
  # CA, one platform credential generated by the registry-credentials hook.
  SHPYRD_REGISTRY_IP: 10.96.0.50
  SHPYRD_REGISTRY_HOST: 10.96.0.50:5000
  SHPYRD_REGISTRY_INSECURE: "false"
  SHPYRD_REGISTRY_SECRET: shpyrd-registry
  SHPYRD_REGISTRY_SIZE: 20Gi
  SHPYRD_REGISTRY_GC: "0 4 * * 0"    # weekly garbage collection (cron, UTC; "off" disables)
  # Certificates come from the development CA (ca-issuers component), shared
  # by every kind cluster on this machine from ~/.shpyrd/ca.
  SHPYRD_CLUSTER_ISSUER: shpyrd-ca
  SHPYRD_CA_SOURCE: local
  SHPYRD_NETWORK_POLICY: none        # kind's kindnet enforces NetworkPolicy (kind 0.24+)
  # No DNS provider locally (RFC-0061 is for cloud profiles).
  SHPYRD_DNS_PROVIDER: none
  SHPYRD_DNS_AUTH: key
  SHPYRD_DNS_COMPARTMENT: ""
  SHPYRD_DNS_TENANCY: ""
  SHPYRD_DNS_REGION: ""
  SHPYRD_DNS_USER: ""
  SHPYRD_ACME_EMAIL: ""
  # SHPYRD_SERVER_IMAGE follows the CLI version (a release installs its own
  # tag, a development build the latest release); --set overrides it.
  SHPYRD_HTTP_PORT: "80"
  SHPYRD_HTTPS_PORT: "443"
  # Who owns 80/443 on the machine (RFC-0057): kind itself, or an existing
  # Caddy proxying to kind's HTTP port; and whether *.<domain> resolves
  # locally through dnsmasq. `shpyrd cluster create` detects and records both.
  SHPYRD_FRONT_DOOR: kind
  SHPYRD_LOCAL_DNS: "false"
  SHPYRD_LB_IP: ""                   # cloud profiles: reserved load balancer address
  # kind's default pod network; project network policies exclude it from
  # the "internet" egress rule so projects cannot reach each other.
  SHPYRD_POD_CIDR: 10.244.0.0/16
runlevels:
  # CRD-only components first: later charts create ServiceMonitors.
  - name: rc0
    components: [monitoring-crds]
  - name: rc1
    components: [cert-manager, registry-credentials]
  - name: rc2
    components: [ca-issuers, trust-manager, ingress-nginx, registry, registry-nodes]
  - name: rc3
    components: [kpack, monitoring]
  - name: rc4
    components: [shpyrd]
