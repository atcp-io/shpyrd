name: aws
description: AWS (EKS) with Network Load Balancers, Let's Encrypt certificates, Route 53 and the in-cluster registry
vars:
  # Pass --domain (the Route 53 zone) and the ACME e-mail; contrib/aws/terraform
  # creates the cluster and prints the command:
  #   --set SHPYRD_ACME_EMAIL=you@example.com --dns aws --dns-zone-id <id> --dns-region <region>
  SHPYRD_DOMAIN: apps.example.com
  # In-cluster registry on a fixed ClusterIP in the cluster's Service range
  # (10.100.0.0/16 in contrib/aws/terraform), TLS from the platform CA.
  SHPYRD_REGISTRY_IP: 10.100.0.50
  SHPYRD_REGISTRY_HOST: 10.100.0.50:5000
  SHPYRD_REGISTRY_INSECURE: "false"
  SHPYRD_REGISTRY_SECRET: shpyrd-registry
  SHPYRD_REGISTRY_SIZE: 20Gi
  SHPYRD_REGISTRY_GC: "0 4 * * 0"    # weekly garbage collection (cron, UTC; "off" disables)
  # Public certificates from Let's Encrypt; the platform CA (generated once
  # in the cluster) signs the registry and the admission webhook.
  SHPYRD_CLUSTER_ISSUER: letsencrypt
  SHPYRD_ACME_EMAIL: ""
  SHPYRD_CA_SOURCE: cluster
  # The VPC CNI enforces NetworkPolicy with its own agent (enableNetworkPolicy
  # in contrib/aws/terraform): no policy engine to install.
  SHPYRD_NETWORK_POLICY: none
  # DNS automation (RFC-0061): --dns aws with the hosted zone and region;
  # the credential is the IAM role EKS Pod Identity gives ExternalDNS and
  # cert-manager (contrib/aws/terraform). Records for the platform's
  # hostnames are then published by ExternalDNS and one wildcard certificate
  # (DNS-01) serves every project.
  # Front doors (RFC-0036): Network Load Balancers from the AWS Load Balancer
  # Controller, with pod targets: an internet-facing one for apps (and the
  # platform, unless --platform-exposure internal puts it on the VPN side)
  # on the Elastic IPs Terraform reserved, and an internal one for
  # exposure:internal, both in the subnets Terraform tagged for them.
  # contrib/aws/terraform prints the values:
  #   --set SHPYRD_AWS_CLUSTER=<name> --set SHPYRD_AWS_REGION=<region>
  #   --set SHPYRD_AWS_VPC_ID=<vpc> --set SHPYRD_AWS_LB_EIPS=<eipalloc>,<eipalloc>
  SHPYRD_AWS_CLUSTER: ""
  SHPYRD_AWS_REGION: ""
  SHPYRD_AWS_VPC_ID: ""
  SHPYRD_AWS_LB_EIPS: ""
  SHPYRD_PLATFORM_EXPOSURE: external
  SHPYRD_INTERNAL_LB: "auto"
  SHPYRD_INTERNAL_LB_SUBNET: ""
  SHPYRD_INGRESS_CLASS_EXTERNAL: nginx
  SHPYRD_INGRESS_CLASS_INTERNAL: nginx-internal
  # Volumes (RFC-0060): EBS gp3 (encrypted, expansion allowed, 1 GiB
  # minimum); snapshots are EBS snapshots; shared volumes are EFS access
  # points in the file system contrib/aws/terraform creates:
  #   --set SHPYRD_EFS_ID=fs-...
  SHPYRD_STORAGE_CLASS: gp3
  SHPYRD_STORAGE_CLASS_SHARED: shpyrd-efs
  SHPYRD_VOLUME_MIN_SIZE: 1Gi
  # Object storage (RFC-0046): the MinIO volume of the object-storage extension.
  # The control-plane database (RFC-0033): PostgreSQL in the cluster unless
  # SHPYRD_DATABASE_URL names a managed one.
  SHPYRD_DATABASE_URL: ""
  SHPYRD_CONTROL_PLANE_DB_SIZE: 5Gi
  SHPYRD_OBJECT_STORAGE_SIZE: 20Gi
  # Platform backups (RFC-0037): nightly encrypted archives of the platform's
  # state to the provider's object storage (contrib/*/terraform prints the
  # target); empty means none.
  SHPYRD_BACKUP_TARGET: ""
  SHPYRD_BACKUP_ENDPOINT: ""
  SHPYRD_BACKUP_REGION: ""
  SHPYRD_BACKUP_SCHEDULE: "0 3 * * *"
  SHPYRD_BACKUP_KEEP: "14"
  SHPYRD_SNAPSHOT_CLASS: ebs-snapshot
  SHPYRD_EFS_ID: ""
  SHPYRD_FSS_MOUNT_TARGET: ""
  SHPYRD_FSS_AD: ""
  SHPYRD_DNS_PROVIDER: none
  SHPYRD_DNS_AUTH: key
  SHPYRD_DNS_ZONE_ID: ""
  SHPYRD_DNS_COMPARTMENT: ""
  SHPYRD_DNS_TENANCY: ""
  SHPYRD_DNS_REGION: ""
  SHPYRD_DNS_USER: ""
  # A cloud load balancer terminates nothing and listens on 80/443: URLs carry no port.
  SHPYRD_FRONT_DOOR: lb
  # The public front door's Elastic IPs (comma-separated; Terraform prints
  # them): what customers allow-list or point an apex A record at. DNS uses
  # the load balancer's hostname regardless.
  SHPYRD_LB_IP: ""
  SHPYRD_LOCAL_DNS: "false"
  SHPYRD_HTTP_PORT: "80"
  SHPYRD_HTTPS_PORT: "443"
  # VPC CNI: pods take addresses from the VPC.
  SHPYRD_POD_CIDR: 10.0.0.0/16
runlevels:
  - name: rc0
    components: [monitoring-crds]
  - name: rc1
    components: [aws-load-balancer-controller, cert-manager, registry-credentials, snapshot-controller, storage-gp3, storage-efs]
  - name: rc2
    components: [letsencrypt-issuers, ca-issuers, trust-manager, ingress-nginx, ingress-nginx-internal, registry, registry-nodes, external-dns]
  - name: rc3
    components: [kpack, monitoring, dns, control-plane-db]
  - name: rc4
    components: [shpyrd, platform-backup]
