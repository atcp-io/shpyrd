name: oci
description: Oracle Cloud (OKE) with a public load balancer, Let's Encrypt certificates and the in-cluster registry
vars:
  # Pass --domain (a wildcard DNS record you own) and the address
  # (contrib/oci/terraform creates the cluster and prints them):
  #   --set SHPYRD_ACME_EMAIL=you@example.com --set SHPYRD_LB_IP=<reserved address>
  # A provider registry instead of the in-cluster one (RFC-0059):
  #   --registry-host <region-key>.ocir.io/<tenancy-namespace>
  #   --registry-user <tenancy-namespace>/<user> --registry-token-file ~/.oci/ocir-token
  SHPYRD_DOMAIN: apps.example.com
  # In-cluster registry on a fixed ClusterIP in the cluster's Service range
  # (10.96.0.0/16 in contrib/oci/terraform), TLS from the platform CA.
  SHPYRD_REGISTRY_IP: 10.96.0.50
  SHPYRD_REGISTRY_HOST: 10.96.0.50:5000
  SHPYRD_REGISTRY_INSECURE: "false"
  SHPYRD_REGISTRY_SECRET: shpyrd-registry
  SHPYRD_REGISTRY_SIZE: 50Gi        # OCI block volumes start at 50 GB
  SHPYRD_REGISTRY_GC: "0 4 * * 0"    # weekly garbage collection (cron, UTC; "off" disables)
  # Public certificates from Let's Encrypt; the platform CA (generated once
  # in the cluster) signs the registry and the admission webhook.
  SHPYRD_CLUSTER_ISSUER: letsencrypt
  SHPYRD_ACME_EMAIL: ""
  SHPYRD_CA_SOURCE: cluster
  # OKE with VCN-native pod networking enforces no NetworkPolicy on its own;
  # project isolation needs Calico in policy-only mode (Oracle's supported
  # path). "none" when the cluster already runs a policy engine.
  SHPYRD_NETWORK_POLICY: calico
  # DNS automation (RFC-0061): `--dns oci` with the compartment, tenancy,
  # region and either the DNS user's API key (--dns-user, --dns-key-file) or
  # --dns-auth workload on an enhanced cluster. Records for the platform's
  # hostnames are then published by ExternalDNS and one wildcard certificate
  # (DNS-01) serves every project.
  # Front doors (RFC-0036): external LB for the platform (default; move to
  # internal when you have a VPN). Pass --internal-lb-subnet <ocid> to
  # create the private controller; SHPYRD_INTERNAL_LB=false skips it.
  SHPYRD_PLATFORM_EXPOSURE: external
  SHPYRD_INTERNAL_LB: "auto"
  SHPYRD_INTERNAL_LB_SUBNET: ""
  SHPYRD_INGRESS_CLASS_EXTERNAL: nginx
  SHPYRD_INGRESS_CLASS_INTERNAL: nginx-internal
  # Volumes (RFC-0060): OCI Block Volume (balanced performance, expansion
  # allowed), which starts at 50 GB; snapshots are block volume backups.
  # Shared volumes are File Storage file systems behind the mount target
  # contrib/oci/terraform creates (shared_storage = true; its outputs give
  # both values): --set SHPYRD_FSS_MOUNT_TARGET=<ocid> --set SHPYRD_FSS_AD=<ad>
  SHPYRD_STORAGE_CLASS: oci-bv
  SHPYRD_STORAGE_CLASS_SHARED: shpyrd-fss
  SHPYRD_VOLUME_MIN_SIZE: 50Gi
  SHPYRD_SNAPSHOT_CLASS: oci-bv-backup
  SHPYRD_FSS_MOUNT_TARGET: ""
  SHPYRD_EFS_ID: ""
  SHPYRD_FSS_AD: ""
  SHPYRD_DNS_PROVIDER: none
  SHPYRD_DNS_AUTH: key
  SHPYRD_DNS_ZONE_ID: ""
  SHPYRD_DNS_COMPARTMENT: ""
  SHPYRD_DNS_TENANCY: ""
  SHPYRD_DNS_REGION: ""
  SHPYRD_DNS_USER: ""
  # A cloud load balancer terminates nothing and listens on 80/443: URLs carry no port.
  SHPYRD_FRONT_DOOR: lb
  # Reserved public address for the load balancer (contrib/oci/terraform output
  # load_balancer_ip); empty lets OCI pick an ephemeral one.
  SHPYRD_LB_IP: ""
  SHPYRD_LOCAL_DNS: "false"
  SHPYRD_HTTP_PORT: "80"
  SHPYRD_HTTPS_PORT: "443"
  # OKE VCN-native pod networking: pods get addresses from the pod subnet;
  # with the flannel CNI use 10.244.0.0/16.
  SHPYRD_POD_CIDR: 10.0.4.0/22
runlevels:
  - name: rc0
    components: [monitoring-crds]
  - name: rc1
    components: [network-policy, cert-manager, registry-credentials, snapshot-controller, storage-fss]
  - name: rc2
    components: [letsencrypt-issuers, ca-issuers, trust-manager, ingress-nginx, ingress-nginx-internal, registry, registry-nodes, external-dns, dns01-oci]
  - name: rc3
    components: [kpack, monitoring, dns]
  - name: rc4
    components: [shpyrd]
