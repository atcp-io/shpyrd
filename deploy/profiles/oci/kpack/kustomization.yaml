# OCI profile: the builder pushes to OCIR with the registry credentials
# Secret (hook registry-credentials) linked to its ServiceAccount.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../components/kpack/base
patches:
  - target:
      kind: ServiceAccount
      name: kpack-builder
    patch: |
      - op: add
        path: /secrets
        value:
          - name: shpyrd-registry
      - op: add
        path: /imagePullSecrets
        value:
          - name: shpyrd-registry
