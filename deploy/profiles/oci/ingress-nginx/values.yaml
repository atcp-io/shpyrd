# OCI profile: a public OCI Load Balancer (flexible shape, 10 Mbps: the
# Always Free size) in the cluster's default LB subnet. A private load
# balancer for internal hostnames is RFC-0036.
controller:
  service:
    type: LoadBalancer
    annotations:
      oci.oraclecloud.com/load-balancer-type: "lb"
      service.beta.kubernetes.io/oci-load-balancer-shape: "flexible"
      service.beta.kubernetes.io/oci-load-balancer-shape-flex-min: "10"
      service.beta.kubernetes.io/oci-load-balancer-shape-flex-max: "10"
  publishService:
    enabled: true
  replicaCount: 1
