apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  namespace: logs-system
---
# Vector reads pod metadata (labels, annotations) to enrich log lines with
# project/process/instance labels and to filter non-project namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shpyrd-vector
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shpyrd-vector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: shpyrd-vector
subjects:
  - kind: ServiceAccount
    name: vector
    namespace: logs-system
