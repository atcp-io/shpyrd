apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: logs-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vector
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vector
        app.kubernetes.io/part-of: shpyrd
    spec:
      serviceAccountName: vector
      tolerations:
        # Run on control-plane nodes too so build pods (on the control-plane
        # in kind) are reachable.
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vector
          image: docker.io/timberio/vector:0.58.0-alpine
          # drains.yaml is rendered by the LogDrain controller (RFC-0023);
          # --watch-config reloads both files when they change. Header
          # values reach the config as ${ENV} references only: they live in
          # Secrets mirrored into this namespace and injected as env, so the
          # rendered file never carries a secret. Vector 0.58 gates env
          # interpolation behind this flag.
          args:
            - --config
            - /etc/vector/vector.yaml
            - --config
            - /etc/vector/drains/drains.yaml
            - --watch-config
            - --dangerously-allow-env-var-interpolation
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: VECTOR_SELF_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: VECTOR_SELF_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: api
              containerPort: 8686
            - name: metrics
              containerPort: 9598
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/vector
              readOnly: true
            - name: drains
              mountPath: /etc/vector/drains
              readOnly: true
            - name: data
              mountPath: /var/lib/vector
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: vector
        - name: drains
          configMap:
            name: vector-drains
        - name: data
          emptyDir: {}
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
---
# One pod answers for delivery metrics; every pod runs the same sinks.
apiVersion: v1
kind: Service
metadata:
  name: vector
  namespace: logs-system
spec:
  selector:
    app.kubernetes.io/name: vector
  ports:
    - name: metrics
      port: 9598
      targetPort: metrics
