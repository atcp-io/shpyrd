# ingress-nginx values shared by all profiles. Profiles override how traffic
# reaches the controller (host ports on kind, a cloud load balancer on AWS).
controller:
  ingressClassResource:
    name: nginx
    default: true
  watchIngressWithoutClass: true

  config:
    # Trust X-Forwarded-* only when a front door (Caddy) sits in front of
    # the controller (RFC-0057); on the public port the header is a lie.
    use-forwarded-headers: "${SHPYRD_FORWARDED_HEADERS}"
    # Per-host metrics power the shpyrd "web app" dashboards.
    enable-metrics: "true"

  # The platform's server answers for what no app answers: the edge's
  # "available to team X" page for a 403 from auth_request (RFC-0033), and
  # unknown hosts (a branded "no app here" instead of nginx's 404).
  extraArgs:
    default-backend-service: shpyrd-system/shpyrd-server

  # The identity headers are the edge's to set (RFC-0033): whatever a client
  # sends in them is blanked on every request to every app, public ones
  # included; where sign-in is on, auth_request puts the real values back.
  proxySetHeaders:
    X-Shpyrd-User: ""
    X-Shpyrd-Email: ""
    X-Shpyrd-Name: ""
    X-Shpyrd-Teams: ""
    X-Shpyrd-Roles: ""

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        app.kubernetes.io/part-of: shpyrd

  admissionWebhooks:
    enabled: true
    certManager:
      enabled: true

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
