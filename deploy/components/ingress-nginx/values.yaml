# ingress-nginx values shared by all profiles. Profiles override how traffic
# reaches the controller (host ports on kind, a cloud load balancer on AWS).
controller:
  ingressClassResource:
    name: nginx
    default: true
  watchIngressWithoutClass: true

  config:
    # Trust X-Forwarded-* only when a front door (Caddy) sits in front of
    # the controller (RFC-0057); on the public port the header is a lie.
    use-forwarded-headers: "${SHPYRD_FORWARDED_HEADERS}"
    # Per-host metrics power the shpyrd "web app" dashboards.
    enable-metrics: "true"

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        app.kubernetes.io/part-of: shpyrd

  admissionWebhooks:
    enabled: true
    certManager:
      enabled: true

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
