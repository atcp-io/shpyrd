name: ingress-nginx
description: Ingress controller; on kind it binds host ports 80/443 on the control-plane node
namespace: ingress-nginx
helm:
  repo: https://kubernetes.github.io/ingress-nginx
  chart: ingress-nginx
  version: 4.15.1
  release: ingress-nginx
  values: [values.yaml]
wait:
  - deployment: ingress-nginx/ingress-nginx-controller
  - dryRun:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: shpyrd-webhook-probe
        namespace: ingress-nginx
      spec:
        ingressClassName: nginx
        rules:
          - host: probe.invalid
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: probe
                      port:
                        number: 80
timeout: 8m
