# The control-plane database (RFC-0033): one PostgreSQL instance with a
# persistent volume, credentials from the Secret the control-plane-db-credentials
# hook writes. A single replica: the server caches roles and sessions, so a
# restart of this pod is a pause of sign-ins and team edits, not an outage of
# the apps. A managed database (SHPYRD_DATABASE_URL) replaces it in the cloud.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: control-plane-db
  labels:
    app.kubernetes.io/name: control-plane-db
spec:
  serviceName: control-plane-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane-db
        app.kubernetes.io/part-of: shpyrd
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: docker.io/library/postgres:17-alpine
          args: ["-c", "max_connections=50", "-c", "shared_buffers=64MB"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: shpyrd
            - name: POSTGRES_USER
              value: shpyrd
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: control-plane-db
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "shpyrd", "-d", "shpyrd", "-h", "127.0.0.1"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "shpyrd", "-d", "shpyrd", "-h", "127.0.0.1"]
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: ${SHPYRD_CONTROL_PLANE_DB_SIZE}
