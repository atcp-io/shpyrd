# Second ingress-nginx controller for the internal front door (RFC-0036).
# The profile overlay adds the provider's internal load balancer annotations
# (a private flexible LB on OCI, an internal NLB on AWS). Projects marked
# exposure:internal and platform endpoints with SHPYRD_PLATFORM_EXPOSURE=internal
# use ingress class "nginx-internal".
controller:
  ingressClassResource:
    name: nginx-internal
    default: false
    controllerValue: "k8s.io/ingress-nginx-internal"
  ingressClass: nginx-internal
  watchIngressWithoutClass: false
  electionID: ingress-nginx-internal-leader

  config:
    use-forwarded-headers: "${SHPYRD_FORWARDED_HEADERS}"
    enable-metrics: "true"

  # The identity headers are the edge's to set (RFC-0033): whatever a client
  # sends in them is blanked on every request to every app, public ones
  # included; where sign-in is on, auth_request puts the real values back.
  proxySetHeaders:
    X-Shpyrd-User: ""
    X-Shpyrd-Email: ""
    X-Shpyrd-Name: ""
    X-Shpyrd-Teams: ""
    X-Shpyrd-Roles: ""

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        app.kubernetes.io/part-of: shpyrd

  admissionWebhooks:
    enabled: true
    certManager:
      enabled: true

  extraArgs:
    default-ssl-certificate: ${SHPYRD_DEFAULT_TLS_SECRET}
    # The platform's server answers for what no app answers (RFC-0033).
    default-backend-service: shpyrd-system/shpyrd-server

  service:
    type: LoadBalancer
    externalTrafficPolicy: Local

  publishService:
    enabled: true

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
