# Second ingress-nginx controller for the internal front door (RFC-0036).
# On OCI a private flexible load balancer sits in the private LB subnet;
# other providers use a similar internal-LB annotation. Projects marked
# exposure:internal and platform endpoints with SHPYRD_PLATFORM_EXPOSURE=internal
# use ingress class "nginx-internal".
controller:
  ingressClassResource:
    name: nginx-internal
    default: false
    controllerValue: "k8s.io/ingress-nginx-internal"
  ingressClass: nginx-internal
  watchIngressWithoutClass: false
  electionID: ingress-nginx-internal-leader

  config:
    use-forwarded-headers: "${SHPYRD_FORWARDED_HEADERS}"
    enable-metrics: "true"

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        app.kubernetes.io/part-of: shpyrd

  admissionWebhooks:
    enabled: true
    certManager:
      enabled: true

  extraArgs:
    default-ssl-certificate: ${SHPYRD_DEFAULT_TLS_SECRET}

  service:
    type: LoadBalancer
    annotations:
      oci.oraclecloud.com/load-balancer-type: "lb"
      service.beta.kubernetes.io/oci-load-balancer-shape: "flexible"
      service.beta.kubernetes.io/oci-load-balancer-shape-flex-min: "10"
      service.beta.kubernetes.io/oci-load-balancer-shape-flex-max: "10"
      service.beta.kubernetes.io/oci-load-balancer-internal: "true"
      service.beta.kubernetes.io/oci-load-balancer-subnet1: "${SHPYRD_INTERNAL_LB_SUBNET}"
      service.beta.kubernetes.io/oci-load-balancer-security-list-management-mode: "None"
    externalTrafficPolicy: Local

  publishService:
    enabled: true

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
