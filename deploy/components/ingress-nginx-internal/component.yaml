name: ingress-nginx-internal
description: Internal ingress controller for projects and platform endpoints marked exposure:internal (RFC-0036)
namespace: ingress-nginx-internal
helm:
  repo: https://kubernetes.github.io/ingress-nginx
  chart: ingress-nginx
  version: 4.15.1
  release: ingress-nginx-internal
  values: [values.yaml]
wait:
  - deployment: ingress-nginx-internal/ingress-nginx-internal-controller
  - dryRun:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: shpyrd-webhook-probe
        namespace: ingress-nginx-internal
      spec:
        ingressClassName: nginx-internal
        rules:
          - host: probe.invalid
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: probe
                      port:
                        number: 80
timeout: 8m
