name: dex
description: Dex OpenID Connect issuer with local email/password accounts (extension auth-local)
namespace: shpyrd-system
hooks: [oidc-client]
kustomize:
  path: base
wait:
  - deployment: shpyrd-system/dex
  - condition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      namespace: shpyrd-system
      name: dex-tls
      type: Ready
timeout: 5m
