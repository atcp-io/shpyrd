apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dex
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dex
      annotations:
        # Dex reads its ConfigMap at start only: roll the Deployment when
        # the URLs baked into the config change (domain or front door).
        shpyrd.io/config-urls: "${SHPYRD_AUTH_URL} ${SHPYRD_DASHBOARD_URL}"
    spec:
      serviceAccountName: dex
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Dex takes a whole web tree or none: copy the one shipped in the
        # image and lay the shpyrd theme and templates over it (RFC-0012).
        - name: web
          image: ghcr.io/dexidp/dex:v2.45.1
          command:
            - sh
            - -ec
            - |
              cp -R /srv/dex/web/. /web/
              mkdir -p /web/themes/shpyrd
              cp /theme/styles.css /theme/logo.svg /web/themes/shpyrd/
              cp /theme/header.html /theme/password.html /web/templates/
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: web
              mountPath: /web
            - name: theme
              mountPath: /theme
              readOnly: true
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.45.1
          args: [dex, serve, /etc/dex/config.yaml]
          env:
            - name: KUBERNETES_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SHPYRD_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shpyrd-oidc-client
                  key: client-secret
          ports:
            - name: http
              containerPort: 5556
            - name: telemetry
              containerPort: 5558
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: telemetry
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: telemetry
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/dex
              readOnly: true
            - name: web
              mountPath: /web
              readOnly: true
            - name: tmp # dex expands its config into a temp file
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: dex
        - name: theme
          configMap:
            name: dex-web
        - name: web
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dex
spec:
  selector:
    app.kubernetes.io/name: dex
  ports:
    - name: http
      port: 5556
      targetPort: http
