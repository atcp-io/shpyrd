apiVersion: v1
kind: ConfigMap
metadata:
  name: dex
data:
  config.yaml: |
    issuer: ${SHPYRD_AUTH_URL}
    storage:
      type: kubernetes
      config:
        inCluster: true
    web:
      http: 0.0.0.0:5556
    telemetry:
      http: 0.0.0.0:5558
    # The pages Dex still serves (connector chooser, password fallback) use
    # the shpyrd theme assembled by the web init container (RFC-0012).
    frontend:
      dir: /web
      issuer: shpyrd
      theme: shpyrd
      logoURL: theme/logo.svg
    oauth2:
      skipApprovalScreen: true
      responseTypes: [code]
      # The dashboard signs local accounts in through the password grant
      # from its own page (RFC-0012).
      passwordConnector: local
    expiry:
      idTokens: 24h
      refreshTokens:
        validIfNotUsedFor: 168h
        absoluteLifetime: 720h
    # Local accounts (Password objects managed with `shpyrd users`).
    enablePasswordDB: true
    staticClients:
      - id: shpyrd
        name: shpyrd dashboard
        secretEnv: SHPYRD_OIDC_CLIENT_SECRET
        redirectURIs:
          - ${SHPYRD_DASHBOARD_URL}/api/auth/callback
