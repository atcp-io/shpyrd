apiVersion: v1
kind: ConfigMap
metadata:
  name: dex
data:
  config.yaml: |
    issuer: ${SHPYRD_AUTH_URL}
    storage:
      type: kubernetes
      config:
        inCluster: true
    web:
      http: 0.0.0.0:5556
    telemetry:
      http: 0.0.0.0:5558
    frontend:
      issuer: shpyrd
      theme: light
    oauth2:
      skipApprovalScreen: true
      responseTypes: [code]
    expiry:
      idTokens: 24h
      refreshTokens:
        validIfNotUsedFor: 168h
        absoluteLifetime: 720h
    # Local accounts (Password objects managed with `shpyrd users`).
    enablePasswordDB: true
    staticClients:
      - id: shpyrd
        name: shpyrd dashboard
        secretEnv: SHPYRD_OIDC_CLIENT_SECRET
        redirectURIs:
          - ${SHPYRD_DASHBOARD_URL}/api/auth/callback
