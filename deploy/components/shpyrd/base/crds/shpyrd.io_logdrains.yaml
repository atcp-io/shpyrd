      type: string
    - jsonPath: .spec.format
      name: Format
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LogDrain forwards a project's (or every project's) log lines
          to a receiver.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              LogDrainSpec forwards log lines to an external receiver (RFC-0023). A
              drain in a project namespace (app-<slug>) receives that project's lines;
              a drain in the system namespace receives every project's lines.
            properties:
              format:
                description: |-
                  Format is json (one JSON object per line, HTTP batches) or syslog
                  (RFC 5424 over TCP). Defaults from the URL scheme.
                enum:
