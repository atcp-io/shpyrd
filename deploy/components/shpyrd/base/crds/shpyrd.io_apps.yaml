              processes:
                additionalProperties:
                  description: ProcessStatus is the rollout state of one process type.
                  properties:
                    cpu:
                      description: CPU and Memory are the allocation in effect (requests),
                        for display.
                      type: string
                    desired:
                      format: int32
                      type: integer
                    failing:
                      description: Failing counts instances that cannot start or keep
                        crashing.
                      format: int32
                      type: integer
                    memory:
                      type: string
                    pinned:
                      description: Pinned explains a fixed instance count ("single-instance
                        volume data").
                      type: string
                    ready:
                      format: int32
                      type: integer
                    reason:
                      description: 'Reason explains Failing (e.g. "CrashLoopBackOff
                        (exit 128): ...").'
                      type: string
                    size:
                      description: Size is the instance size in effect ("custom" when
                        overridden).
                      type: string
                    updated:
                      format: int32
                      type: integer
                  required:
                  - desired
                  - ready
                  type: object
                description: Processes reports rollout state per process type.
                type: object
              releases:
                description: Releases is the deployment history, oldest first.
                items:
                  description: Release is one entry of the deployment history.
                  properties:
                    bindings:
                      description: |-
                        Bindings records the resources attached to the release; rollback
                        restores them.
                      items:
                        description: |-
                          Binding attaches a project resource to an app (RFC-0003). The resource's
                          connection details are injected as config vars named <prefix>_<VAR>,
                          e.g. DATABASE_URL, through the Secret <app>-bindings.
                        properties:
                          kind:
                            description: Kind of the resource (Postgres, Redis, ...).
                            type: string
                          name:
                            description: Name of the resource in the project.
                            type: string
                          prefix:
                            description: Prefix of the injected variable names; defaults
                              per kind.
                            type: string
                        required:
                        - kind
                        - name
                        type: object
                      type: array
                    configHash:
                      description: |-
                        ConfigHash covers env vars, the <app>-env Secret, bound vars, sizes
                        and the global vars injected.
                      type: string
                    createdAt:
                      format: date-time
                      type: string
                    description:
                      type: string
                    globalHash:
                      description: |-
                        GlobalHash fingerprints the global vars injected at the time, so a
                        release can be told apart as "Global config change" (RFC-0016).
                      type: string
                    image:
                      type: string
                    number:
                      type: integer
                    processes:
                      description: |-
                        Processes lists the process types the release ran with; rolling back
                        to a build that lacks a current process type cannot start it.
                      items:
                        type: string
                      type: array
                    sizes:
                      additionalProperties:
                        type: string
                      description: |-
                        Sizes records the instance size of each process type; rollback
                        restores them.
                      type: object
                    source:
                      description: Source identifies the code (git commit or archive
                        sha).
                      type: string
                  required:
                  - createdAt
                  - image
                  - number
                  type: object
                type: array
              staleImages:
                description: |-
                  StaleImages are images of releases that left the history and that no
                  kept release uses; the controller deletes them from the in-cluster
                  registry and removes them from the list (RFC-0059).
                items:
                  type: string
                type: array
              url:
                description: URL of the web process, when exposed.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
