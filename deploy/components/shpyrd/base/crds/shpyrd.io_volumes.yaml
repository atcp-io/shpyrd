kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: volumes.shpyrd.io
spec:
  group: shpyrd.io
  names:
    kind: Volume
    listKind: VolumeList
    plural: volumes
    shortNames:
    - vol
    singular: volume
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.size
      name: Size
      type: string
    - jsonPath: .spec.accessMode
      name: Mode
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Volume is a persistent disk that processes of the project mount.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: VolumeSpec describes a persistent disk of a project (RFC-0006).
            properties:
              accessMode:
                description: |-
                  AccessMode is ReadWriteOnce (default: a single-instance volume, the
                  mounting process runs one instance with Recreate rollouts) or
                  ReadWriteMany (shared: needs a provisioner that offers it).
                enum:
                - ReadWriteOnce
                - ReadWriteMany
                type: string
              fromSnapshot:
                description: |-
                  FromSnapshot creates the volume from a snapshot (a VolumeSnapshot in
                  the project) instead of empty (RFC-0060). Immutable.
                type: string
              size:
                anyOf:
                - type: integer
                - type: string
                description: |-
                  Size of the volume, e.g. 5Gi. Can grow (never shrink) when the
                  storage class allows expansion.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              storageClass:
                description: StorageClass to provision from; empty means the cluster
                  default.
                type: string
            required:
            - size
            type: object
          status:
            description: VolumeStatus reports the state of the claim.
            properties:
              capacity:
                description: Capacity actually provisioned.
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              message:
                type: string
              mountedBy:
                description: MountedBy lists "<app>/<process>" pairs using the volume.
                items:
                  type: string
                type: array
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: Phase is Pending, Bound or Failed.
                type: string
              restoredFrom:
                description: |-
                  RestoredFrom is the snapshot the current claim was restored from, if
                  any (RFC-0060).
                type: string
              storageClass:
                description: |-
                  StorageClass the claim was provisioned from (the profile's default
                  when the spec names none).
                type: string
            type: object
