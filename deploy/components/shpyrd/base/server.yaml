apiVersion: apps/v1
kind: Deployment
metadata:
  name: shpyrd-server
  labels:
    app.kubernetes.io/name: shpyrd-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: shpyrd-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shpyrd-server
    spec:
      serviceAccountName: shpyrd-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ${SHPYRD_SERVER_IMAGE}
          imagePullPolicy: IfNotPresent
          args: ["--addr", ":8080"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SHPYRD_DOMAIN
              value: ${SHPYRD_DOMAIN}
            - name: SHPYRD_REGISTRY_HOST
              value: ${SHPYRD_REGISTRY_HOST}
            - name: SHPYRD_VERSION
              value: ${SHPYRD_VERSION}
            # The port public URLs carry: 443 behind a front door even when
            # kind itself listens on a high port (RFC-0057).
            - name: SHPYRD_HTTPS_PORT
              value: "${SHPYRD_URL_PORT}"
            - name: SHPYRD_DASHBOARD_URL
              value: ${SHPYRD_DASHBOARD_URL}
            - name: SHPYRD_AUTH_URL
              value: ${SHPYRD_AUTH_URL}
            - name: SHPYRD_EXTENSIONS
              value: "${SHPYRD_EXTENSIONS}"
            - name: SHPYRD_POD_CIDR
              value: "${SHPYRD_POD_CIDR}"
            - name: SHPYRD_CLUSTER_ISSUER
              value: ${SHPYRD_CLUSTER_ISSUER}
            # Private registries (RFC-0035): builds push and instances pull
            # with this Secret, mirrored into every project namespace.
            - name: SHPYRD_REGISTRY_SECRET
              value: "${SHPYRD_REGISTRY_SECRET}"
            - name: SHPYRD_REGISTRY_INSECURE
              value: "${SHPYRD_REGISTRY_INSECURE}"
            # Build pods get the platform CA (trust bundle + SSL_CERT_FILE) from
            # the admission webhook below (RFC-0059).
            - name: SHPYRD_WEBHOOK_ADDR
              value: ":9443"
            - name: SHPYRD_WEBHOOK_TLS_DIR
              value: /etc/shpyrd/webhook-tls
            - name: SHPYRD_CA_BUNDLE
              value: shpyrd-ca-bundle
            # The server itself trusts the platform CA (registry catalog,
            # manifest deletes) through the same bundle.
            - name: SSL_CERT_FILE
              value: /etc/shpyrd/ca/ca-certificates.crt
            # In-cluster registry (RFC-0059): address, volume size and the
            # weekly garbage collection schedule (cron, UTC; "off" disables).
            - name: SHPYRD_REGISTRY_IP
              value: "${SHPYRD_REGISTRY_IP}"
            - name: SHPYRD_REGISTRY_SIZE
              value: "${SHPYRD_REGISTRY_SIZE}"
            - name: SHPYRD_REGISTRY_GC
              value: "${SHPYRD_REGISTRY_GC}"
            # With a DNS provider the wildcard certificate is the front
            # door's default; project Ingresses then carry no certificate.
            - name: SHPYRD_WILDCARD_TLS
              value: "${SHPYRD_WILDCARD_TLS}"
            # Volumes (RFC-0060): classes, provider minimum and snapshot class.
            - name: SHPYRD_STORAGE_CLASS
              value: "${SHPYRD_STORAGE_CLASS}"
            - name: SHPYRD_STORAGE_CLASS_SHARED
              value: "${SHPYRD_STORAGE_CLASS_SHARED}"
            - name: SHPYRD_VOLUME_MIN_SIZE
              value: "${SHPYRD_VOLUME_MIN_SIZE}"
            - name: SHPYRD_SNAPSHOT_CLASS
              value: "${SHPYRD_SNAPSHOT_CLASS}"
            - name: SHPYRD_FSS_MOUNT_TARGET
              value: "${SHPYRD_FSS_MOUNT_TARGET}"
            - name: SHPYRD_PROFILE
              value: "${SHPYRD_PROFILE}"
            - name: SHPYRD_INGRESS_CLASS_EXTERNAL
              value: "${SHPYRD_INGRESS_CLASS_EXTERNAL}"
            - name: SHPYRD_INGRESS_CLASS_INTERNAL
              value: "${SHPYRD_INGRESS_CLASS_INTERNAL}"
            - name: SHPYRD_PLATFORM_EXPOSURE
              value: "${SHPYRD_PLATFORM_EXPOSURE}"
            # The controller behind the platform's own hostnames (RFC-0036):
            # the server dials it for sign-in discovery instead of the LB.
            - name: SHPYRD_INGRESS_SERVICE
              value: "${SHPYRD_PLATFORM_INGRESS_SERVICE}"
            - name: SHPYRD_LB_IP
              value: "${SHPYRD_LB_IP}"
            - name: SHPYRD_INTERNAL_LB_ADDRESS
              value: ""  # populated by the controller at runtime
            - name: SHPYRD_DATA_DIR
              value: /data
            - name: SHPYRD_LEADER_ELECT
              value: "1"
            - name: SHPYRD_PROMETHEUS_URL
              value: http://monitoring-prometheus.monitoring.svc:9090
            - name: SHPYRD_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: shpyrd-admin-token
                  key: token
            # "true" once `shpyrd cluster token --disable` switched the token off:
            # sign-in then goes through accounts only.
            - name: SHPYRD_ADMIN_TOKEN_DISABLED
              valueFrom:
                secretKeyRef:
                  name: shpyrd-admin-token
                  key: disabled
                  optional: true
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 8081
            - name: webhook
              containerPort: 9443
          volumeMounts:
            - name: data
              mountPath: /data
            - name: webhook-tls
              mountPath: /etc/shpyrd/webhook-tls
              readOnly: true
            - name: shpyrd-ca
              mountPath: /etc/shpyrd/ca
              readOnly: true
          # Probes tolerate a busy node (builds run on the same machine locally).
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: shpyrd-data
        - name: webhook-tls
          secret:
            secretName: shpyrd-webhook-tls
        - name: shpyrd-ca
          configMap:
            name: shpyrd-ca-bundle
---
apiVersion: v1
kind: Service
metadata:
  name: shpyrd-server
  labels:
    app.kubernetes.io/name: shpyrd-server
spec:
  selector:
    app.kubernetes.io/name: shpyrd-server
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: webhook
      port: 9443
      targetPort: webhook
