name: ca-issuers
description: ClusterIssuer backed by the platform CA (from ~/.shpyrd/ca locally, generated in the cluster on cloud profiles)
namespace: cert-manager
hooks: [local-ca]
kustomize:
  path: base
wait:
  - condition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      name: shpyrd-ca
      type: Ready
timeout: 3m
