# cert-manager values shared by all profiles.
crds:
  enabled: true
  keep: true

global:
  leaderElection:
    namespace: cert-manager

resources:
  requests:
    cpu: 20m
    memory: 64Mi

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi

# Prometheus scraping is wired through kube-prometheus-stack's
# ServiceMonitor discovery; the CRDs exist from runlevel rc0.
prometheus:
  enabled: true
  servicemonitor:
    enabled: true
