# The in-cluster registry (RFC-0059): one replica on a fixed ClusterIP,
# TLS only, with a certificate from the platform CA whose SAN is that
# address, and HTTP basic auth against the credential the installer
# generated (Secrets shpyrd-registry and registry-htpasswd, hook
# registry-credentials). Builds trust the CA through the trust bundle
# (kpack: the build-pod webhook; BuildKit: SSL_CERT_FILE); nodes through the
# registry-nodes component. Health and metrics are served without
# authentication on the debug port. There is no plaintext listener:
# go-containerregistry races http against https for RFC 1918 addresses, and
# only a TLS-only registry makes that race always end on https.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: ${SHPYRD_REGISTRY_SIZE}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: registry-tls
spec:
  secretName: registry-tls
  issuerRef:
    kind: ClusterIssuer
    name: shpyrd-ca
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  ipAddresses:
    - ${SHPYRD_REGISTRY_IP}
    - 127.0.0.1
  dnsNames:
    - registry.${SHPYRD_SYSTEM_NS}.svc
    - registry.${SHPYRD_SYSTEM_NS}.svc.cluster.local
    - localhost
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-config
data:
  config.yml: |
    version: 0.1
    log:
      level: info
      formatter: text
    storage:
      filesystem:
        rootdirectory: /var/lib/registry
      delete:
        enabled: true
      cache:
        blobdescriptor: inmemory
    auth:
      htpasswd:
        realm: shpyrd
        path: /etc/registry/auth/htpasswd
    http:
      addr: :5000
      tls:
        certificate: /etc/registry/tls/tls.crt
        key: /etc/registry/tls/tls.key
      debug:
        addr: :5001
        prometheus:
          enabled: true
          path: /metrics
      headers:
        X-Content-Type-Options: [nosniff]
    health:
      storagedriver:
        enabled: true
        interval: 10s
        threshold: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  labels:
    app.kubernetes.io/name: registry
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          image: docker.io/library/registry:3
          args: ["serve", "/etc/distribution/config.yml"]
          ports:
            - name: https
              containerPort: 5000
            - name: debug
              containerPort: 5001
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
            - name: config
              mountPath: /etc/distribution
              readOnly: true
            - name: tls
              mountPath: /etc/registry/tls
              readOnly: true
            - name: auth
              mountPath: /etc/registry/auth
              readOnly: true
          readinessProbe:
            httpGet:
              path: /debug/health
              port: debug
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /debug/health
              port: debug
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
        - name: config
          configMap:
            name: registry-config
        - name: tls
          secret:
            secretName: registry-tls
        - name: auth
          secret:
            secretName: registry-htpasswd
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  labels:
    app.kubernetes.io/name: registry
spec:
  type: NodePort
  clusterIP: ${SHPYRD_REGISTRY_IP}
  selector:
    app.kubernetes.io/name: registry
  ports:
    - name: https
      port: 5000
      targetPort: https
      nodePort: 30050
    - name: debug
      port: 5001
      targetPort: debug
