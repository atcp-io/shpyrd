# Garage (garagehq.deuxfleurs.fr), one node, on the profile's block storage
# class: the platform's S3-compatible object store. Consumers never hold the
# admin token (Secret object-storage-admin, hook object-storage-credentials);
# the ObjectBucket controller gives each a key that opens one bucket
# (RFC-0046). The store speaks plain HTTP inside the cluster: keys are per
# bucket and namespaces are isolated by network policy.
apiVersion: v1
kind: ConfigMap
metadata:
  name: object-storage-config
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    metadata_snapshots_dir = "/var/lib/garage/snapshots"
    metadata_auto_snapshot_interval = "6h"
    db_engine = "lmdb"
    replication_factor = 1
    compression_level = 1

    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "127.0.0.1:3901"

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.object-storage"

    [admin]
    api_bind_addr = "[::]:3903"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: object-storage-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: ${SHPYRD_OBJECT_STORAGE_SIZE}
---
apiVersion: v1
kind: Service
metadata:
  name: object-storage
spec:
  selector:
    app.kubernetes.io/name: object-storage
  ports:
    - name: s3
      port: 3900
      targetPort: s3
    - name: admin
      port: 3903
      targetPort: admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: object-storage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: object-storage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: object-storage
        app.kubernetes.io/part-of: shpyrd
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: garage
          image: docker.io/dxflrs/garage:v2.4.1
          args: ["/garage", "server"]
          env:
            - name: GARAGE_CONFIG_FILE
              value: /etc/garage/garage.toml
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: object-storage-admin
                  key: rpcSecret
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: object-storage-admin
                  key: adminToken
            - name: GARAGE_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: object-storage-admin
                  key: metricsToken
          ports:
            - name: s3
              containerPort: 3900
            - name: admin
              containerPort: 3903
          # /health says 503 until the layout is applied, which the platform
          # does through this Service: probe the sockets instead.
          readinessProbe:
            tcpSocket:
              port: admin
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/garage
              readOnly: true
            - name: data
              mountPath: /var/lib/garage
      volumes:
        - name: config
          configMap:
            name: object-storage-config
        - name: data
          persistentVolumeClaim:
            claimName: object-storage-data
